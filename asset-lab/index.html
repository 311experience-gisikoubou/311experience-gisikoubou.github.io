<body><div id="app"></div>
<script>
(()=>{'use strict';
const K='ai-asset-lab-demo-v01'; // keep v0.1 storage untouched and compatible
const fmt=(n)=>Number(n).toLocaleString('ja-JP',{maximumFractionDigits:0});
const yen=(n)=>'¥'+fmt(n);
const price0=2500;
const initial=()=>({cash:1000000,qty:0,avg:0,price:price0,orders:[],pending:null,realized:0,done:false,guide:true,step:0,view:'home',orderType:'market',orderQty:10,limitPrice:2450,sellQty:10,refill:false,scenario:'初期価格'});
let s=initial();
let assistantOpen=false;let selectedHelp='';let replyHelp='';let userDraft='';let copiedStatus='';
let localFeedback={helpQuestions:0,hardToUnderstand:0,helpful:0};
try{const stored=JSON.parse(localStorage.getItem('ai-asset-lab-feedback-v02')||'null');if(stored && typeof stored==='object')localFeedback={helpQuestions:Math.max(0,Math.min(10000,Number(stored.helpQuestions)||0)),hardToUnderstand:Math.max(0,Math.min(10000,Number(stored.hardToUnderstand)||0)),helpful:Math.max(0,Math.min(10000,Number(stored.helpful)||0))};}catch(e){}
try{const v=JSON.parse(localStorage.getItem(K)||'null');if(v&&Number.isFinite(v.cash)&&Number.isFinite(v.qty)&&Array.isArray(v.orders))s={...initial(),...v};}catch(e){}
const app=document.querySelector('#app');
const save=()=>{try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const worth=()=>s.cash+s.qty*s.price;
const loss=()=>s.qty*(s.price-s.avg);

const questionsByView={
 home:['まず何から始める？','実資金と仮想資金の違いは？','ETFって何？','いくら損する可能性がある？'],
 trade:[['証券口座とは？','NISAって何？','本物の口座は必要？','なぜ練習から始める？'],['ETFって何？','銘柄コードとは？','なぜ価格が動く？','いくらで買える？'],['成行と指値の違いは？','何口買えばいい？','買付余力とは？','損失は出るの？'],['注文確認で大切なことは？','買う前に戻れる？','成行の価格は確定？','購入金額は？'],['注文と約定の違いは？','なぜ注文中なの？','約定後はどうなる？','注文は取り消せる？'],['含み損益とは？','株価が下がると？','売らずに待つと？','評価額とは？'],['売却するとどうなる？','何口売れる？','利益には税金がかかる？','売り時の考え方は？'],['売却の確認で大切なことは？','約定とは？','いくら戻る？','売る前に戻れる？'],['何が勉強できた？','利益と損失の違いは？','もう一度練習したい','次は何を学ぶ？']],
 learn:['株式って何？','ETFって何？','NISAって何？','長期投資とは？'],
 world:['ニュースで株は動く？','金利とは？','円安とは？','原油価格との関係は？'],
 ai:['AIは株価を当てられる？','予測と投資判断の違いは？','予測の答え合わせは？','比較対象はなぜ必要？'],
 portfolio:['含み損益とは？','実現損益とは？','取引履歴とは？','現金残高とは？']
};
function contextTitle(){return s.view==='trade'?`売買体験 STEP ${s.step+1}/9：${guideTitles[s.step]||'取引練習'}`:({'home':'ホーム','learn':'投資を学ぶ','world':'世界情勢','ai':'AI予測研究','portfolio':'保有資産'}[s.view]||'ホーム');}
function suggestedQuestions(){return s.view==='trade'?questionsByView.trade[s.step]||questionsByView.trade[0]:questionsByView[s.view]||questionsByView.home;}
function educationalAnswer(question){
const q=String(question).toLowerCase();
const rules=[
[/成行.*指値|指値.*成行|成行/,`成行（なりゆき）は値段を指定せずに出す注文、指値（さしね）は「この値段以下なら買う」と決める注文です。成行は価格が想定より高くなることもあり、指値は注文が成立しないことがあります。`],
[/nisa/,`NISAは、一定の条件で投資から得た利益が非課税になる日本の制度です。ただし投資そのものが安全になる制度ではありません。NISA口座を開くのは将来必要になった時で大丈夫。ここでは実際の口座は作りません。`],
[/証券口座|本物の口座/,`本物の投資では、証券会社で口座開設し、本人確認・入金などを行います。このアプリは練習用なので、登録も本人確認も不要。仮想の100万円だけで体験できます。`],
[/etf|銘柄コード/,`ETF（上場投資信託）は、株と同じように売買できる投資信託です。日経平均などの指数に連動する商品があります。銘柄コードは商品を区別する番号。今の「DEMO-ETF」は架空の商品です。`],
[/注文.*約定|約定|注文中|取り消/,`「注文」は買いたい・売りたいという申し込み。「約定（やくじょう）」は実際に売買が成立することです。指値が市場価格と合わないと、注文中のままになる場合があります。注文取消も、成立前に間に合うとは限りません。`],
[/買付余力|いくらで買|購入金額|何口買/,`買付余力とは、注文に使えるお金です。この練習の残高は${yen(s.cash)}。現在の架空価格は1口${yen(s.price)}なので、たとえば10口なら${yen(s.price*10)}（練習用の概算）です。手数料や実際の値動きは簡略化しています。`],
[/含み損益|評価額|売らずに待/,`含み損益は「今の価格で売ったと仮定したときの損益」です。まだ確定していません。今の保有数量は${fmt(s.qty)}口、練習価格は${yen(s.price)}、含み損益は${loss()>=0?'+':'−'}${yen(Math.abs(loss()))}です。`],
[/実現損益|売却|売り時|売る|戻る/,`売却が成立すると、買った価格と売った価格の差が実現損益になります。株価は上にも下にも動くため、損が確定する場合もあります。「いつ売るか」は正解がひとつではありません。まず練習では売買金額を確かめよう。`],
[/税金/,`実際の株式売却益などは原則として課税対象ですが、NISAの条件を満たす取引は非課税になる場合があります。この練習では税金・手数料を0円として計算しています。`],
[/金利/,`金利は、お金を借りるときの利息などの割合。金利上昇は企業の資金調達コストや家計の負担に影響しますが、株価が必ず下がるわけではありません。`],
[/円安|為替/,`円安は、円の価値が外貨に対して下がること。輸入品の価格を押し上げる一方、海外売上が大きい企業には追い風になる場合もあります。企業によって影響は違います。`],
[/原油|ニュース/,`ニュースは株価を動かす材料のひとつ。ただしニュースが出た時点で市場が織り込んでいることもあり、方向を確実に予測できません。World Monitorは情報を観察する場所として使います。`],
[/予測|ai|当てられる|比較対象/,`AIの予測には間違いがあります。利益を出せるかは、予測を記録し、未来の実際の値動きと比較しないと判断できません。長期保有・現金保有など、単純な方法との比較が重要です。`],
[/長期投資/,`長期投資は短期の上げ下げだけで判断せず、長い期間保有する考え方です。長期でも元本割れはあります。分散・費用・生活資金の確保が大切です。`],
[/損|下がる|リスク/,`株やETFは値下がりします。元本保証はありません。この練習では最初の資金が減る場面も体験できます。生活費や緊急資金は将来の実投資と分けて考えることが大切です。`],

if(s.step===3){const p=s.orderType==='market'?s.price:Number(s.limitPrice),quantity=Number(s.orderQty);return `<section class="card">${trHead('4. 注文内容を確認','まだ購入は確定していません。誤発注を防ぐ大切な画面です。')}<div class="stack"><div class="mini"><h3 class="h3">日本株指数 練習ETF</h3>${row('売買','買い')}${row('注文方法',s.orderType==='market'?'成行':'指値')}${row('数量',fmt(quantity)+'口')}${row('価格',s.orderType==='market'?'成行（仮計算 '+yen(s.price)+'）':yen(p))}${row('見込金額',yen(p*quantity))}${row('手数料（デモ）','¥0')}</div><div class="education"><strong>確認するのは3つ</strong><div class="small muted">① 商品名　② 買い / 売り　③ 数量と金額。実際の成行注文では、表示価格で買える保証はありません。</div></div><div class="flex">${btnback(2)}${action('この内容で仮想注文を出す','buyNow')}</div></div></section>`;}
if(s.step===4){const pending=!!s.pending;return `<section class="card">${trHead(pending?'5. 注文を受け付けました':'5. 買い注文が約定しました',pending?'まだ売買は成立していません。':'練習取引が成立し、保有資産に反映されました。')}<div class="stack"><div class="mini"><div class="pill">${pending?'注文中（未約定）':'約定済み'}</div><h2 class="h2" style="margin-top:12px">${pending?'指値では待つことがある':'注文と約定の違いが分かった！'}</h2><p class="small muted">${pending?'指定した価格まで下がらなければ買えない場合があります。':'この試作では市場でのマッチングを省略し、練習価格で約定した扱いにしています。'}</p>${row('現金残高',yen(s.cash))}${row('保有口数',fmt(s.qty)+'口')}</div>${pending?`<div class="flex">${action('練習価格を指値まで下げて約定','fillPending')}${action('注文を取り消す','cancelPending','line')}</div>`:`<div>${action('保有資産を確認する','step5')}</div>`}</div></section>`;}
if(s.step===5){if(s.qty<=0){return `<section class="card">${trHead('保有資産','まだ保有資産がありません。')}<p class="muted">買い注文を約定させてから先へ進みましょう。</p>${action('購入へ戻る','step2')}</section>`;}
return `<section class="card">${trHead('6. 保有資産の値動きを見る','株価が変わると、売る前でも評価額が変動します。')}<div class="stack">${quote()}<div class="mini">${row('保有数',fmt(s.qty)+'口')}${row('平均購入価格',yen(s.avg))}${row('現在の評価額',yen(s.qty*s.price))}${row('含み損益',`<span class="${loss()>=0?'good':'bad'}">${loss()>=0?'+':'−'}${yen(Math.abs(loss()))}</span>`)}</div><div class="education"><strong>翌営業日の価格変動を疑似体験</strong><p class="small muted" style="margin:5px 0 12px">値動きは現実の予測ではなく、学習用の仮定です。上がる場合も下がる場合も確かめられます。</p><div class="flex">${action('仮に5%上昇したら','priceUp','soft')}${action('仮に5%下落したら','priceDown','line')}</div></div><div class="flex">${action('売り注文を体験する','step6')}${action('保有資産一覧','portfolio','line')}</div></div></section>`;}
if(s.step===6){const q=Number(s.sellQty);const err=Number.isInteger(q)&&q>=1&&q<=s.qty?'':'保有口数以下の整数を入力してください。';return `<section class="card">${trHead('7. 売り注文を入力','売ると、その時点の損益が確定します。')}<div class="stack">${quote()}<div class="field"><label for="sellQty">売る数量（口）</label><input id="sellQty" type="number" min="1" max="${s.qty}" step="1" class="input" value="${s.sellQty}"><div class="small muted">売却可能：${fmt(s.qty)}口</div></div><div class="mini">${row('注文方法','成行（初回練習）')}${row('売却額の目安',Number.isInteger(q)&&q>=1?yen(q*s.price):'—')}${row('購入価格との差',Number.isInteger(q)&&q>=1?((s.price-s.avg)>=0?'+':'−')+yen(Math.abs(q*(s.price-s.avg))):'—')}</div>${err?`<div class="warn" role="alert">${err}</div>`:''}<div class="flex">${btnback(5)}${action('売り注文を確認','confirmSell','primary',err?'disabled':'')}</div></div></section>`;}
if(s.step===7){const q=Number(s.sellQty);return `<section class="card">${trHead('8. 売り注文の最終確認','購入時と同様に、数量や価格を確認します。')}<div class="stack"><div class="mini">${row('商品','日本株指数 練習ETF')}${row('売買','売り')}${row('数量',fmt(q)+'口')}${row('練習用の約定価格',yen(s.price))}${row('売却金額',yen(s.price*q))}${row('実現損益の目安',(s.price>=s.avg?'+':'−')+yen(Math.abs((s.price-s.avg)*q)))}</div><div class="warn">実際の成行注文は価格が確定していません。この試作では、練習価格で直ちに約定した扱いにしています。</div><div class="flex">${btnback(6)}${action('この内容で仮想売却する','sellNow')}</div></div></section>`;}
return `<section class="card">${trHead('9. お疲れさまでした！','買う→保有する→売る、ひと通り体験できました。')}<div class="stack"><div class="mini">${row('現在の現金',yen(s.cash))}${row('まだ保有している資産',yen(s.qty*s.price))}${row('総資産',yen(worth()))}${row('開始時からの差額',(worth()>=1000000?'+':'−')+yen(Math.abs(worth()-1000000)))}</div><div class="notice"><strong>学んだこと</strong><div>注文と約定は別。保有中の値動きは「含み損益」、売って確定した差は「実現損益」です。実際は手数料・税金などにも注意が必要です。この練習では受渡日を省略し、売却代金を即時に仮想現金へ反映しています。</div></div><div class="flex">${action('チュートリアルを完了する','finish')}${action('取引履歴を見る','portfolio','line')}</div></div></section>`;
}
const guideTitles=['口座の準備','商品の選択','買い注文','最終確認','注文と約定','保有中の値動き','売り注文','売却確認','結果を見る'];
const guideTexts=['実際の取引ではまず証券口座を開設します。ここでは手続きの説明を読むだけでOK。','「銘柄」「現在の値段」「買える単位」に注目しましょう。','まずは成行注文から。指値の仕組みも切り替えて試せます。','金融商品・売買・数量・金額を見直す習慣をつけましょう。','指値注文には成立しない場合があります。注文中なら、価格を動かすか取消を試せます。','同じ数量でも市場価格により評価額が増減します。値下がりも体験してみよう。','持っている範囲で売却します。最初は成行だけを使います。','いくらで売るか確認しましょう。実際の価格は保証されません。','体験は完了です。次回はガイドを飛ばし、再度ガイドを見ることもできます。'];
function trade(){return `<div class="stack"><div class="subhead"><h1 class="title">売買体験チュートリアル</h1><span class="chip">架空の価格だけを使用</span></div><div class="steps" aria-label="進行度 ${s.step+1}/9">${guideTitles.map((t,i)=>`<span class="step ${i<=s.step?'done':''}" title="${i+1}. ${t}"></span>`).join('')}</div><div class="trade-wrap">${stepCard()}<aside class="coach">${s.guide?`<span class="count">STEP ${s.step+1} / 9</span><h3>${guideTitles[s.step]}</h3><p class="small muted">${guideTexts[s.step]}</p><hr class="rule"/><div class="small"><strong>学習のポイント</strong><p class="muted" style="margin:4px 0">分からないところは「学ぶ」で確認できます。この画面では本物の注文は出ません。</p></div>`:`<span class="count">自由操作モード</span><h3>説明を閉じています</h3><p class="small muted">いつでもガイドを表示できます。</p>`}<div class="coach-inline"><div class="coach-inline-head">✦ 分からなければ、ここで相談</div><div class="small muted">今のステップに合わせて、質問と説明を表示します。</div><button type="button" class="btn soft sm" data-help="open">この場面について質問する →</button></div><div class="stack">${s.guide?action('チュートリアルをスキップ','skip','line'):action('説明ガイドを表示','resumeGuide','soft')}${action('最初からやり直す','resetConfirm','plain')}</div></aside></div><div class="data-note">この画面は教育用のシミュレーターです。実在の証券会社・商品・市場注文には接続していません。</div></div>`;}
function portfolio(){return `<div class="stack">${banner('保有資産と取引履歴','仮想取引の内容を記録して、あとから振り返ろう。','📊')}<div class="grid3"><div class="card"><div class="label">総資産</div><div class="metric sm">${yen(worth())}</div></div><div class="card"><div class="label">現金</div><div class="metric sm">${yen(s.cash)}</div></div><div class="card"><div class="label">累積実現損益</div><div class="metric sm ${s.realized>=0?'good':'bad'}">${s.realized>=0?'+':'−'}${yen(Math.abs(s.realized))}</div></div></div><section class="card"><div class="subhead"><h2 class="h2">保有中の商品</h2>${s.qty>0?'<span class="pill">評価額 '+yen(s.qty*s.price)+'</span>':''}</div>${s.qty?`<div class="mini"><h3 class="h3">日本株指数 練習ETF</h3>${row('保有口数',fmt(s.qty)+'口')}${row('購入平均価格',yen(s.avg))}${row('現在の練習価格',yen(s.price))}${row('含み損益',(loss()>=0?'+':'−')+yen(Math.abs(loss())))}</div><div class="bottom-gap">${action('売り注文を練習する','step6')}</div>`:`<div class="empty">現在保有している商品はありません。<br>買い注文が約定すると、ここに表示されます。<div class="bottom-gap">${action('仮想購入を体験する','step1','soft')}</div></div>`}</section><section class="card"><h2 class="h2">取引履歴</h2>${s.orders.length?`<div class="tablewrap"><table><thead><tr><th>時刻</th><th>種類</th><th>数量</th><th>価格</th><th>状態</th></tr></thead><tbody>${s.orders.slice().reverse().map(o=>`<tr><td>${esc(o.time)}</td><td>${esc(o.kind)}</td><td>${fmt(o.qty)}口</td><td>${yen(o.price)}</td><td>${esc(o.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">まだ取引の記録はありません。</div>'}</section><div class="flex">${action('最初からやり直す（仮想データ初期化）','resetConfirm','line')}</div></div>`;}
function render(){const nv=nav();const screens={home,trade,portfolio,learn,world,ai};const f=screens[s.view]||home;app.innerHTML=`<div class="shell"><header class="top"><div class="brand"><span class="mark">⌁</span><span>AI資産形成研究所</span></div><div class="top-right"><span class="chip">練習モード</span>${action('ガイドを最初から','start','line sm hide-mobile')}</div></header><div class="layout"><nav class="sidebar" aria-label="メインメニュー">${nv.side}<div class="side-note"><span class="eyebrow">OUR PROMISE</span><p class="small">実資金 <strong>0円</strong><br>データはこのブラウザ内にだけ保存。市場への注文はできません。</p></div></nav><main class="main">${f()}</main></div></div><nav class="mobilebar" aria-label="モバイルメニュー">${nv.mobile}</nav>`;save();drawAssistant();}
function err(msg){alert(msg);}
function record(kind,qty,price,status){s.orders.push({kind,qty,price,status,time:new Date().toLocaleString('ja-JP',{hour12:false})});}
function validBuy(){const qty=Number(s.orderQty);const p=s.orderType==='market'?s.price:Number(s.limitPrice);return Number.isInteger(qty)&&qty>=1&&qty<=100000&&Number.isInteger(p)&&p>0&&qty*p<=s.cash;}
function buy(){if(!validBuy())return err('数量・金額・買付余力を見直してください。');const q=Number(s.orderQty),p=s.orderType==='market'?s.price:Number(s.limitPrice);if(s.orderType==='limit'&&p<s.price){s.pending={qty:q,limit:p};record('買い指値',q,p,'注文中');stepForward(4);return;}
executeBuy(q,s.price,s.orderType==='market'?'買い成行':'買い指値');stepForward(4);}
function executeBuy(q,p,kind,usePending=false){const cost=q*p;if(cost>s.cash)return false;const total=s.qty*s.avg+cost;s.cash-=cost;s.qty+=q;s.avg=total/s.qty;if(usePending){const o=[...s.orders].reverse().find(o=>o.status==='注文中');if(o){o.price=p;o.status='約定';}else record(kind,q,p,'約定');}else record(kind,q,p,'約定');s.pending=null;s.sellQty=s.qty;return true;}
function handleAction(a){switch(a){case 'start':if(s.orders.length){if(!confirm('チュートリアルを最初から始めると、練習の残高と取引履歴を初期化します。よろしいですか？'))return;}s=initial();s.view='trade';break;
case 'skip':s.guide=false;s.done=true;s.step=s.qty>0?5:1;s.view='home';break;
case 'resumeGuide':s.guide=true;break;
case 'finish':s.done=true;s.guide=false;s.view='home';break;
case 'resetConfirm':if(!confirm('練習データをすべて初期化します。実際の資金や他のデータに影響はありません。よろしいですか？'))return;s=initial();s.view='trade';break;
case 'portfolio':s.view='portfolio';break;
case 'confirmBuy':if(!validBuy())return err('入力した内容に誤りがあります。');s.step=3;s.view='trade';break;
case 'buyNow':buy();return;
case 'fillPending':if(!s.pending)return;s.price=s.pending.limit;const q=s.pending.qty;if(!executeBuy(q,s.price,'買い指値',true))return err('残高不足のため約定できません。');break;
case 'cancelPending':if(s.pending){s.pending=null;const o=[...s.orders].reverse().find(o=>o.status==='注文中');if(o)o.status='取消';}s.step=2;break;
case 'priceUp':s.price=Math.round(s.price*1.05);s.scenario='架空の+5%変動';break;
case 'priceDown':s.price=Math.max(1,Math.round(s.price*.95));s.scenario='架空の-5%変動';break;
case 'confirmSell':{const q=Number(s.sellQty);if(!Number.isInteger(q)||q<1||q>s.qty)return err('売却数量を見直してください。');s.step=7;break;}
case 'sellNow':{const q=Number(s.sellQty);if(!Number.isInteger(q)||q<1||q>s.qty)return err('売却数量を見直してください。');s.realized+=q*(s.price-s.avg);s.cash+=q*s.price;s.qty-=q;if(s.qty===0)s.avg=0;record('売り成行',q,s.price,'約定');s.step=8;break;}
default: if(/^step[0-8]$/.test(a)){s.step=Number(a.slice(4));s.view='trade';}else return;}
save();render();}
app.addEventListener('click',(e)=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.view){s.view=target.dataset.view;selectedHelp='';replyHelp='';render();window.scrollTo({top:0,behavior:'auto'});return;}if(target.dataset.type){s.orderType=target.dataset.type;render();return;}if(target.dataset.action){handleAction(target.dataset.action);window.scrollTo({top:0,behavior:'auto'});}});
app.addEventListener('input',(e)=>{const t=e.target;if(!t||!t.id)return;if(t.id==='orderQty')s.orderQty=t.value;if(t.id==='limitPrice')s.limitPrice=t.value;if(t.id==='sellQty')s.sellQty=t.value;save();});
app.addEventListener('change',(e)=>{const t=e.target;if(['orderQty','limitPrice','sellQty'].includes(t.id))render();});

document.addEventListener('click',(e)=>{
const el=e.target.closest('[data-help], [data-help-question], [data-feedback]');if(!el)return;
if(el.dataset.help==='open'){showAssistant();return;}
if(el.dataset.help==='close'){assistantOpen=false;copiedStatus='';drawAssistant();document.querySelector('.helper-launch')?.focus();return;}
if(el.dataset.help==='copy'){copyQuestion();return;}
if(el.hasAttribute('data-help-question')){selectedHelp=el.dataset.helpQuestion;replyHelp=educationalAnswer(selectedHelp);userDraft='';localFeedback.helpQuestions=Math.min(localFeedback.helpQuestions+1,10000);try{localStorage.setItem('ai-asset-lab-feedback-v02',JSON.stringify(localFeedback))}catch(e){}copiedStatus='';drawAssistant();return;}
if(el.dataset.feedback){feedback(el.dataset.feedback);return;}
});
document.addEventListener('input',(e)=>{if(e.target?.id==='customQuestion'){userDraft=e.target.value.slice(0,500);const area=document.querySelector('#outboundPrompt');if(area)area.value=promptForChatGPT();}});
document.addEventListener('keydown',(e)=>{if(e.key==='Escape'&&assistantOpen){assistantOpen=false;drawAssistant();document.querySelector('.helper-launch')?.focus();}});
render();
})();
</script>
</body>
</html>
